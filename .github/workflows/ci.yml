name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its older run; main and tags always run to the end.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint split three ways by path hash (scripts/lint-shard.mjs), through eslint directly: the lock in
  # one-at-a-time.mjs only matters when several cards share one Mac. --cache (content strategy, since a
  # checkout resets mtimes) is restored between runs. lint-shard --check fails if a file falls through.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: lint (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/lint-shard.mjs --check 3
      - uses: actions/cache@v4
        with:
          path: .eslintcache-${{ matrix.shard }}
          key: eslint-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-
      - run: node scripts/lint-shard.mjs ${{ matrix.shard }}/3 --cache --cache-strategy content --cache-location .eslintcache-${{ matrix.shard }}

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tsc's incremental info and Next's type cache: a warm restore makes the check a delta.
      - uses: actions/cache@v4
        with:
          path: |
            tsconfig.tsbuildinfo
            .next/cache
          key: tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm run typecheck

  # The suite split six ways with vitest --shard through the same runner (so its memory gate and RSS
  # watchdog still apply to each shard). Every test file lands in exactly one shard.
  test:
    runs-on: ubuntu-latest
    # A hung test file (a render loop) once ran the job for 20+ minutes toward the 6-hour default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    name: test (${{ matrix.shard }}/6)
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --shard=${{ matrix.shard }}/6

  # The one required status: green only when lint, typecheck and every test shard passed.
  check:
    if: always()
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "lint=${{ needs.lint.result }} typecheck=${{ needs.typecheck.result }} test=${{ needs.test.result }}"
          [ "${{ needs.lint.result }}" = success ] && [ "${{ needs.typecheck.result }}" = success ] && [ "${{ needs.test.result }}" = success ]

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks binary, not gitleaks-action: the action needs a paid license on organization repos.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - run: gitleaks git --redact --no-banner .
